name: AgentGuard security audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Audit agent configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run AgentGuard
        run: agentguard scan . --json --sarif agentguard-results.sarif > agentguard-report.json || true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: agentguard-report
          path: |
            agentguard-report.json
            agentguard-results.sarif
      - name: Upload SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: agentguard-results.sarif
