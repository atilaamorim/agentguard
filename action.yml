name: AgentGuard
description: Audit AI-agent and MCP configuration for security and context risks
author: Atila Amorim

inputs:
  path:
    description: Directory or file to scan
    required: false
    default: "."
  fail-on-findings:
    description: Fail the workflow when AgentGuard reports findings
    required: false
    default: "false"
  baseline:
    description: Optional JSON baseline file; only new findings are reported
    required: false
    default: ""
  github-annotations:
    description: Emit GitHub Actions annotations for findings
    required: false
    default: "true"
  policy:
    description: Optional path to an AgentGuard YAML policy file
    required: false
    default: ""
  max-context-tokens:
    description: Optional estimated token budget for agent instruction files
    required: false
    default: ""
  fail-on-severity:
    description: Exit with failure only when a finding reaches this severity
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install AgentGuard
      shell: bash
      run: python -m pip install -e "${{ github.action_path }}"
    - name: Run AgentGuard
      shell: bash
      env:
        AGENTGUARD_BASELINE: ${{ inputs.baseline }}
        AGENTGUARD_ANNOTATIONS: ${{ inputs.github-annotations }}
        AGENTGUARD_CONTEXT_BUDGET: ${{ inputs.max-context-tokens }}
        AGENTGUARD_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        AGENTGUARD_POLICY: ${{ inputs.policy }}
      run: |
        set +e
        optional_args=()
        if [ "$AGENTGUARD_ANNOTATIONS" = "true" ]; then
          optional_args+=(--github-annotations)
        fi
        if [ -n "$AGENTGUARD_BASELINE" ]; then
          optional_args+=(--baseline "$AGENTGUARD_BASELINE")
        fi
        if [ -n "$AGENTGUARD_CONTEXT_BUDGET" ]; then
          optional_args+=(--max-context-tokens "$AGENTGUARD_CONTEXT_BUDGET")
        fi
        if [ -n "$AGENTGUARD_FAIL_ON_SEVERITY" ]; then
          optional_args+=(--fail-on-severity "$AGENTGUARD_FAIL_ON_SEVERITY")
        fi
        if [ -n "$AGENTGUARD_POLICY" ]; then
          optional_args+=(--policy "$AGENTGUARD_POLICY")
        fi
        agentguard scan "${{ inputs.path }}" --json --sarif agentguard-results.sarif --html agentguard-report.html "${optional_args[@]}" > agentguard-report.json
        status=$?
        if [ "$status" -gt 1 ]; then
          exit "$status"
        fi
        if [ "$status" -eq 1 ] && { [ "${{ inputs.fail-on-findings }}" = "true" ] || [ -n "$AGENTGUARD_FAIL_ON_SEVERITY" ]; }; then
          exit 1
        fi
        exit 0
    - name: Upload AgentGuard reports
      uses: actions/upload-artifact@v6
      with:
        name: agentguard-results
        path: |
          agentguard-report.json
          agentguard-results.sarif
          agentguard-report.html
